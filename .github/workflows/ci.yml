name: CI - Build and Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    env:
      TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=murayama_vulnerable_api_tests;Username=murayama;Password=test-password"
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: murayama
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: murayama_vulnerable_api_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U murayama"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal